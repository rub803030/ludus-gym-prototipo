<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Terminal de operación Ludus Gym: accesos, cobros y expedientes en un solo flujo.">
  <title>Ludus Gym · Terminal de operación</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <a class="skip-link" href="#screen">Saltar a la vista activa</a>

  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand__mark" aria-hidden="true">L</span>
        <span class="brand__id">
          <strong>LUDUS<span>/GYM</span></strong>
          <span class="meta">OPERACIÓN · SEDE CENTRAL</span>
        </span>
      </div>
      <div class="topbar__tools">
        <span class="build">BUILD 0.1 · DEMO</span>
        <nav class="segment" aria-label="Seleccionar vista">
          <button type="button" data-action="role" data-role="socio" aria-pressed="true">SOCIO</button>
          <button type="button" data-action="role" data-role="admin" aria-pressed="false">ADMIN</button>
        </nav>
      </div>
    </header>

    <div class="workspace">
      <aside class="rail" aria-label="Flujos del prototipo">
        <nav class="rail__group" aria-label="Flujos de socio">
          <p class="rail__label">01 / SOCIO</p>
          <button type="button" data-action="go" data-role="socio" data-screen="socio-home">Acceso <span class="idx">01</span></button>
          <button type="button" data-action="go" data-role="socio" data-screen="socio-routine">Rutina y carga <span class="idx">02</span></button>
          <button type="button" data-action="go" data-role="socio" data-screen="socio-nutrition">Nutrición <span class="idx">03</span></button>
          <button type="button" data-action="go" data-role="socio" data-screen="socio-bookings">Reservas <span class="idx">04</span></button>
        </nav>
        <nav class="rail__group" aria-label="Flujos de administración">
          <p class="rail__label">02 / OPERACIÓN</p>
          <button type="button" data-action="go" data-role="admin" data-screen="admin-dashboard">Cobranza <span class="idx">05</span></button>
          <button type="button" data-action="go" data-role="admin" data-screen="admin-register">Alta de socio <span class="idx">06</span></button>
          <button type="button" data-action="go" data-role="admin" data-screen="admin-member">Expediente <span class="idx">07</span></button>
          <button type="button" data-action="go" data-role="admin" data-screen="admin-receipt">Recibo <span class="idx">08</span></button>
        </nav>
        <p class="rail__foot">DATOS FICTICIOS · SOLO DEMO</p>
      </aside>

      <main class="stage">
        <div class="device">
          <div class="device__bar" aria-hidden="true"><span class="mono">09:41</span><span class="mono">T-01 / LECTOR ACTIVO</span></div>
          <div class="screen" id="screen" tabindex="-1"></div>
        </div>
      </main>
    </div>
  </div>

  <dialog class="sheet" id="pass-dialog" aria-labelledby="pass-title">
    <p class="meta" id="pass-title">CREDENCIAL / SOCIO 0249</p>
    <div id="pass-qr"></div>
    <h2>LUDUS-PASS-0249</h2>
    <p>Presenta el código al lector del torniquete 01. Se renueva cada 18 segundos.</p>
    <button type="button" class="btn btn--primary btn--block" data-action="close-dialog">Cerrar</button>
  </dialog>

  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

  <script src="assets/app.js"></script>
</body>
</html>
